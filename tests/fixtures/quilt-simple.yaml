title: "Quilt Simple Pipeline"
description: "Fixture for a basic quilt select and filter pipeline"
version: "1.0.0"
author: "qsv test suite"
stages:
  load_data:
    type: process
    steps:
      load:
        path: "sample-min.csv"
  
  select_columns:
    type: process
    source: load_data
    steps:
      select:
        colnames: 
          - EventId
          - Level
  
  filter_data:
    type: process
    source: select_columns
    steps:
      isin:
        colname: Level
        values:
          - Info
          - LogAlways
      show:
