title: Quilt benchmark fixture
description: Shared input reused by summary and file outputs
version: 1
parameters:
  output:
    type: path
    required: true
stages:
- name: input
  steps:
  - load: {}
  - select:
      columns: EventId,Level
- name: counts
  from: input
  steps:
  - count:
      columns: EventId
  - show: {}
- name: sample
  from: input
  steps:
  - head:
      number: 10
  - dump:
      output: {"$param": output}
