title: "Quilt Join Pipeline"
description: "Fixture for joining projected event fields"
version: "1.0.0"
author: "qsv test suite"
stages:
  load_stage:
    type: process
    steps:
      load:
        path: "sample-min.csv"

  stage_1:
    type: process
    source: load_stage
    steps:
      select:
        colnames: 
          - TimeCreated
          - EventId

  stage_2:
    type: process
    source: load_stage
    steps:
      select:
        colnames: 
          - TimeCreated
          - Level

  merge_stage:
    type: join
    sources:
      - stage_1
      - stage_2
    params:
      how: inner
      key: TimeCreated
      coalesce: true
  
  final_stage:
    type: process
    source: merge_stage
    steps:
      show:
