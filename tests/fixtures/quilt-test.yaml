title: "Quilt Test Pipeline"
description: "Fixture for a full join and tail showtable pipeline"
version: "1.0.0"
author: "qsv test suite"
stages:
  load_stage:
    type: process
    steps:
      load:
        path: "sample-min.csv"

  stage_1:
    type: process
    source: load_stage
    steps:
      select:
        colnames: 
          - TimeCreated
          - EventId

  stage_2:
    type: process
    source: load_stage
    steps:
      select:
        colnames: 
          - TimeCreated
          - Provider

  merge_stage:
    type: join
    sources:
      - stage_1
      - stage_2
    params:
      how: full
      key: TimeCreated
      coalesce: true
  
  stage_3:
    type: process
    source: merge_stage
    steps:
      tail:
        number: 1
      showtable:
