title: "Quilt Dump Pipeline"
description: "Fixture for dumping quilt output to a CSV file"
version: "1.0.0"
author: "qsv test suite"
stages:
  load_and_process:
    type: process
    steps:
      load:
        path: "sample-min.csv"
      select:
        colnames:
          - TimeCreated
          - EventId
      head:
        number: 2
      dump:
        output: "test_output.csv"
