title: "Quilt Complex Pipeline"
description: "Fixture for a multi-stage quilt transformation pipeline"
version: "1.0.0"
author: "qsv test suite"
stages:
  load_data:
    type: process
    steps:
      load:
        path: "sample-min.csv"

  filter_data:
    type: process
    source: load_data
    steps:
      isin:
        colname: "EventId"
        values: ["1102", "4688", "4689"]
      
  transform_data:
    type: process
    source: filter_data
    steps:
      renamecol:
        old_name: "Level"
        new_name: "severity"
      sed:
        colname: "severity"
        pattern: "Info"
        replacement: "Information"
        ignorecase: false

  sort_data:
    type: process
    source: transform_data
    steps:
      sort:
        colnames: ["EventId"]
        desc: false

  final_output:
    type: process
    source: sort_data
    steps:
      head:
        number: 2
      showtable: 
