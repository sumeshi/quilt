title: Quilt Complex Pipeline
description: Fixture for a multi-stage Quilt transformation pipeline
version: 1
author: qlt test suite
stages:
- name: load_data
  steps:
  - load:
      paths:
      - sample-min.csv
- name: filter_data
  from: load_data
  steps:
  - isin:
      column: EventId
      values:
      - '1102'
      - '4688'
      - '4689'
- name: transform_data
  from: filter_data
  steps:
  - renamecol:
      old: Level
      new: severity
  - sed:
      column: severity
      pattern: Info
      replacement: Information
      ignore-case: false
- name: sort_data
  from: transform_data
  steps:
  - sort:
      columns:
      - EventId
      desc: false
- name: final_output
  from: sort_data
  steps:
  - head:
      number: 2
  - showtable: {}
