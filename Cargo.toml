[package]
name = "quilt"
version = "0.8.0"
edition = "2021"
description = "A Rust CLI for processing CSV/TSV, JSONL/NDJSON, and Parquet data with composable pipelines and streaming-capable execution."
authors = ["sumeshi <sum3sh1@protonmail.com>"]
license = "MIT"

[[bin]]
name = "qlt"
path = "src/main.rs"

[features]
default = []

[dependencies]
comfy-table = { version = "7.1" }
# Used for serde support for chrono
serde = { version = "1.0", features = ["derive"] }
serde_yml = "0.0.12"
# Keep these Polars features aligned with current CLI surface:
# - lazy: core query pipeline
# - csv: load/show/dump CSV support
# - temporal: changetz/timeslice
# - strings + regex: select/contains/sed/grep string operations
# - is_in: membership filtering
# - describe: showquery plan rendering
# - parquet: parquet load + dumpcache
# - dtype-decimal: lossless Decimal128 intermediate for integer delta
polars = { version = "0.48.1", features = ["lazy", "csv", "json", "temporal", "timezones", "strings", "regex", "is_in", "describe", "parquet", "dtype-decimal"], default-features = false }
regex = "1.9"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
log = "0.4"
env_logger = "0.10"
glob = "0.3"
once_cell = "1"
flate2 = "1.0"
rayon = "1.10.0"
rustix = { version = "1.0.7", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[profile.release]
# Optimize for speed with some size reduction
opt-level = 3        # Maximum speed optimization
lto = true           # Enable Link Time Optimization for better performance
codegen-units = 1    # Use single codegen unit for better optimization
panic = "abort"      # Use abort instead of unwind for smaller binary
strip = true         # Strip symbols and debug info
