name: Release

# Fires only when you publish a GitHub Release (you push, tag, and create the
# release yourself). This workflow just builds the binaries and attaches them
# to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: quilt-linux-x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: quilt-windows-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install musl tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cp "target/${{ matrix.target }}/release/qlt.exe" "${{ matrix.name }}-${tag}.exe"
          else
            cp "target/${{ matrix.target }}/release/qlt" "${{ matrix.name }}-${tag}"
            chmod +x "${{ matrix.name }}-${tag}"
          fi

      - name: Upload binary to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ matrix.name }}-${{ github.event.release.tag_name }}*
