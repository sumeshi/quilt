name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
        if: runner.os == 'Linux'
      - run: cargo fmt --check
        if: runner.os == 'Linux'

  linux-musl-release:
    name: Build and smoke test Linux musl release binary
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Smoke test release binary
        shell: bash
        run: bash .github/scripts/cli-smoke.sh target/x86_64-unknown-linux-musl/release/qlt
      - name: Package prerelease artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        shell: bash
        run: |
          mkdir -p dist
          tar -C target/x86_64-unknown-linux-musl/release -czf "dist/qlt-linux-x86_64-musl-${GITHUB_SHA}.tar.gz" qlt
          (cd dist && sha256sum "qlt-linux-x86_64-musl-${GITHUB_SHA}.tar.gz" > "qlt-linux-x86_64-musl-${GITHUB_SHA}.sha256")
      - name: Upload prerelease artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: qlt-linux-x86_64-musl-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
